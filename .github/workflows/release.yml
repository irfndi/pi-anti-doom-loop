name: Release

# Cut a release: bump version in package.json, push tag vX.Y.Z.
# The version bump guard blocks publishing an already-published version and
# verifies the tag matches package.json, so tags and manifests stay in sync.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version (vX.Y.Z) — must match package.json. Leave empty on tag pushes."
        required: false
        type: string

permissions:
  contents: read

# One release at a time: a tag push racing a manual dispatch must not both
# pass the guard and race npm publish (check-then-act TOCTOU window).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags visible to the version guard
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Quality gate (self-check, typecheck, lint, format)
        run: pnpm install --frozen-lockfile && pnpm run check

      - name: Version bump guard
        run: node scripts/guard-publish.ts "$EXPECTED"
        env:
          EXPECTED: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

      - name: Publish to npm
        run: |
          pnpm publish --dry-run --no-git-checks
          pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm scans new publishes before serving them, so `publish` succeeding
      # does not mean `install` works yet. The hold is usually a few minutes but
      # can stretch past ten, so poll for up to 15 minutes before failing.
      - name: Verify the published version is installable
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 60); do
            if npm view "pi-anti-doom-loop@$version" version >/dev/null 2>&1; then
              echo "registry serves pi-anti-doom-loop@$version (attempt $attempt)"
              exit 0
            fi
            echo "published, waiting for the registry to serve $version (attempt $attempt/60)"
            sleep 15
          done
          echo "::error::pi-anti-doom-loop@$version is published but the registry still does not serve it after 15 minutes; check npm for a security hold before re-running anything"
          exit 1
